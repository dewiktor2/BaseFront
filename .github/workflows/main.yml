name: Build CI

on: 
  push:
    branches: ["master"]
  pull_request: 
    branches: ["master']

env:
  NODE_VERSION: 26

jobs:
  build:
    name: Test
  runs-on: ubuntu_latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ NODE_VERSION }}
        cache: npm

    - name: Install
      run: npm ci --legacy-peer-deps

    - name: Lint
      run: npm run lint
